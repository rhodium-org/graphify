# Keeps rhodium-org/graphify a copy of every branch and tag Graphify-Labs/graphify
# has published, and never loses one when upstream deletes or rewrites (mirror/idd).
name: Mirror upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, push nothing
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: mirror
          persist-credentials: false

      - name: Test the mirror
        run: python3 -m unittest discover -s mirror -p 'test_*.py'

      - name: Mirror
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          test -n "$MIRROR_PUSH_TOKEN" || { echo "MIRROR_PUSH_TOKEN is not set" >&2; exit 1; }
          python3 mirror/mirror.py \
            --upstream https://github.com/Graphify-Labs/graphify.git \
            --target "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --work "$RUNNER_TEMP/work" $DRY_RUN

      # REQ-0009: upstream's CI, publishing and welcome bots never act here.
      - name: Keep upstream's workflows from running here
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,path,state -R "$GITHUB_REPOSITORY" \
            | jq -r '.[] | select(.path != ".github/workflows/mirror.yml" and .state == "active") | .id' \
            | while read -r id; do gh workflow disable "$id" -R "$GITHUB_REPOSITORY"; done

      # REQ-0006: one open issue says the mirror is failing.
      - name: Say so when the mirror fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The mirror of Graphify-Labs/graphify is failing"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Run $RUN_URL failed. Nothing in the mirror was changed by it. If upstream has gone, this repository holds everything it last published."
          fi
